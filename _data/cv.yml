    Experience:
      - company: Hanyang University, Department of Physics
        position: Graduate Researcher (Condensed Matter Theory)
        location: Seoul, South Korea
        start_date: 2024
        end_date: present
        summary: "Advisor: Prof. Moon Jip Park"
        highlights:
          - Led a first-author project on odd-parity magnetism in van der Waals heterostructures — derived the Landau free energy and constructed a tight-binding model stabilizing odd-parity magnetic order.
          - Calculated the spectrum of low-angle moiré honeycomb-kagome lattices and identified a higher-order topological insulator phase under specific symmetry conditions.
          - Investigated how interband coupling in flatband lattices modifies the logarithmic entanglement entropy scaling of eta-pairing states.

      - company: Hanyang University, Department of Physics
        position: Undergraduate Researcher (Quantum Geometry Tensor)
        location: Seoul, South Korea
        start_date: 2024
        end_date: 2024
        summary: "Advisor: Prof. Sang-Jin Sin"
        highlights:
          - Demonstrated that Berry curvature percolation plays a key role in determining topological phases in materials.
          - Extended holographic mean field theory to study strongly interacting fermion systems, focusing on symmetry-breaking phenomena and spectral functions.

      - company: Hanyang University (CERN-CMS collaboration)
        position: Undergraduate Researcher (Particle Experiment Simulation)
        location: Seoul, South Korea
        start_date: 2022
        end_date: 2023
        summary: "Advisor: Prof. Tae-Jeong Kim"
        highlights:
          - Searched for di-Higgs (ttHH) production in the di-lepton state for HL-LHC at 14 TeV using Monte Carlo simulations of Phase-II CMS data.
          - Implemented deep neural networks to enhance b-tagged jet identification and classify ttHH signals from background events.

      - company: Hanyang University, Department of Physics
        position: Assistant Instructor, General Physics Laboratory
        location: Seoul, South Korea
        start_date: 2024
        end_date: present
        highlights:
